apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow
spec:
  rules:
    - host: payflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: payflow-frontend, port: { number: 80 } } }
