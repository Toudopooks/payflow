apiVersion: v1
kind: Secret
metadata:
  name: payflow-secrets
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-me
  MYSQL_ROOT_PASSWORD: replace-me
  DATABASE_DSN: "payflow:replace-me@tcp(mysql:3306)/payflow?parseTime=true&multiStatements=true"
  DATABASE_DSN_MIGRATE: "mysql://payflow:replace-me@tcp(mysql:3306)/payflow"
